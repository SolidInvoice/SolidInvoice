# The knpu_oauth2_client package doesn't support config specified in PHP.
knpu_oauth2_client:
    clients:
        google:
            type: google
            client_id: '%env(SOLIDINVOICE_OAUTH_CLIENT_GOOGLE_CLIENT_ID)%'
            client_secret: '%env(SOLIDINVOICE_OAUTH_CLIENT_GOOGLE_CLIENT_SECRET)%'
            redirect_route: _oauth_connect_check
            redirect_params:
                service: google
            #scope: ['email', 'profile']
        oidc:
            type: generic
            provider_class: 'SolidInvoice\UserBundle\OAuth\Provider\OidcProvider'
            client_id: '%env(SOLIDINVOICE_OAUTH_OIDC_CLIENT_ID)%'
            client_secret: '%env(SOLIDINVOICE_OAUTH_OIDC_CLIENT_SECRET)%'
            redirect_route: _oauth_connect_check
            redirect_params:
                service: oidc
            provider_options:
                issuer: '%env(SOLIDINVOICE_OAUTH_OIDC_ISSUER)%'
                # OIDC scopes are space-delimited (Authentik rejects comma-separated scopes).
                scopeSeparator: ' '
