{{- if .Values.scheduler.enabled }}
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "solidinvoice.fullname" . }}-scheduler
  labels:
    {{- include "solidinvoice.labels" . | nindent 4 }}
spec:
  schedule: {{ .Values.scheduler.schedule | quote }}
  timeZone: {{ .Values.scheduler.timeZone | quote }}
  concurrencyPolicy: {{ .Values.scheduler.concurrencyPolicy }}
  startingDeadlineSeconds: 60
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 1
  jobTemplate:
    spec:
      template:
        metadata:
          labels:
            {{- include "solidinvoice.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: scheduler
        spec:
          restartPolicy: OnFailure
          {{- with .Values.imagePullSecrets }}
          imagePullSecrets:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          serviceAccountName: {{ include "solidinvoice.serviceAccountName" . }}
          securityContext:
            {{- toYaml .Values.podSecurityContext | nindent 12 }}
          containers:
            - name: cron
              image: {{ include "solidinvoice.imageName" . }}
              imagePullPolicy: {{ .Values.image.pullPolicy }}
              command:
                - /usr/local/bin/solidinvoice
                - console
                - cron:run
                - --no-ansi
                - --no-interaction
              {{- include "solidinvoice.commonEnv" . | nindent 14 }}
              volumeMounts:
                {{- include "solidinvoice.configVolumeMount" . | nindent 16 }}
              resources:
                {{- toYaml .Values.scheduler.resources | nindent 16 }}
              securityContext:
                {{- toYaml .Values.containerSecurityContext | nindent 16 }}
          volumes:
            {{- include "solidinvoice.configVolume" . | nindent 12 }}
{{- end }}
