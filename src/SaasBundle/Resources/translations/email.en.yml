onboarding:
    signature:
        greeting: See you inside,
        team: — The SolidInvoice team
    footer:
        tagline: Invoicing for freelancers and small businesses.
        reason: You're receiving this because you signed up for SolidInvoice.
        preferences: Email preferences
    welcome:
        subject: Welcome to SolidInvoice
        eyebrow: Welcome aboard
        heading: "Your invoicing setup starts here, %name%."
        lede: "Thanks for creating your SolidInvoice workspace. Over the next few days we'll walk you through getting paid faster — starting with the basics and ending with a workflow that runs itself."
        intro: "Here's what you'll unlock in your first week:"
        feature:
            clients:
                title: Track every client
                desc: Keep contacts, billing addresses, and history in one place.
            invoices:
                title: Send pro invoices
                desc: Branded, itemised, and delivered straight to the inbox.
            payments:
                title: Accept online payments
                desc: Stripe, PayPal, or direct bank — clients choose how to pay.
            dashboard:
                title: See what's owed
                desc: A dashboard that tells you exactly where the money sits.
        closing: "The fastest path is to add your first client. It takes about thirty seconds and unlocks everything else."
        cta: Open your dashboard
        ps: "if you have questions, just hit reply to this email — a real person answers."
    add_first_client:
        subject: Add your first client in under a minute
        eyebrow: Step 1 of 4 · Setup
        heading: "Add your first client in under a minute."
        lede: "Clients are the foundation of everything in SolidInvoice. Once one is in your workspace, invoices, quotes, and payment history all snap into place."
        mock:
            url: app.solidinvoice.app/clients
            header: Your clients
            client1:
                name: Northbeam Design Studio
                sub: "hello@northbeam.co · 3 invoices"
            client2:
                name: Maple & Knox LLC
                sub: "billing@mapleknox.com · 1 invoice"
            empty:
                name: Your next client appears here
                sub: "name, email, currency, and billing address"
        needs_heading: What you'll need
        needs_intro: "Just the essentials — you can fill in more later."
        needs:
            1: Client name or company
            2: An email for sending invoices
            3: "Default currency (we'll pick one based on your region)"
        cta: Add your first client
        ps: "already have a client list in a spreadsheet? Import from CSV and skip this step entirely."
    send_first_invoice:
        subject: Send your first invoice today
        eyebrow: Step 2 of 4 · Get paid
        heading: "Send your first invoice today."
        lede: "A good invoice looks professional, says exactly what the work was, and makes it obvious how to pay. SolidInvoice gives you all three out of the box."
        mock:
            label: Invoice
            status_sent: Sent
            billed_to: Billed to
            client_name: Northbeam Design Studio
            client_email: hello@northbeam.co
            due: Due
            due_date: May 8, 2026
            due_terms: Net 14 days
            col_desc: Description
            col_qty: Qty
            col_rate: Rate
            col_amount: Amount
            item1: Brand identity · discovery
            item2: Logo design & revisions
            total_due: Total due
        included_heading: Everything included, nothing to configure
        included_body: "Line items, taxes, discounts, recurring schedules, due dates, and a \"Pay now\" button — they're all one click away. When your client opens the email, they see a branded invoice with a single clear action."
        cta: Create your first invoice
        ps: "clients pay invoices with a \"Pay now\" button <b>3× faster</b> than ones without. Online payments unlock in the next email."
    turn_invoices_into_payments:
        subject: Turn invoices into payments
        eyebrow: Step 3 of 4 · Get paid faster
        heading: "Turn invoices into payments — automatically."
        lede: "Connect a payment method once and every invoice you send gets a \"Pay now\" button. Clients pay in two clicks; the money lands in your account within days."
        method:
            cards: Cards
            wallet: Wallet
            bank: Bank
            eu_bank: EU bank
        callout:
            title: "Invoices with online pay settle 3× faster"
            sub: "Average: 4 days vs. 14 days for bank-transfer-only invoices."
        how_heading: How it works
        how:
            1: "Connect Stripe or PayPal in Settings → Payment methods (30 seconds)."
            2: "Every invoice automatically shows a \"Pay now\" button."
            3: "Your client pays. You get notified. Status flips to <b style=\"color: #2e963a;\">Paid</b>."
        cta: Connect a payment method
        ps: "fees are whatever your payment provider charges — SolidInvoice adds nothing on top. Ever."
    customize_logo:
        subject: Customize your invoices with your logo
        eyebrow: Step 4 of 4 · Make it yours
        heading: "Your logo. Your colors. Your invoices."
        lede: "Branded invoices get paid faster and look unmistakably yours. Upload a logo, pick a color, and every document you send — invoices, quotes, receipts — is transformed."
        before_label: Before
        after_label: After
        after_brand: Your Studio
        steps_heading: Takes three minutes
        step:
            1:
                title: Upload your logo
                desc: "PNG, SVG, or JPG. It appears on invoices, quotes, and the client portal."
            2:
                title: Pick a primary color
                desc: "Used for buttons, headings, and accents across every document you send."
            3:
                title: Customise your sender email
                desc: "Send from billing@yourstudio.com — not a generic no-reply address."
        cta: Brand your workspace
        ps: "businesses with branded invoices report <b>18% fewer payment disputes</b>. Yours will look like a million bucks."
    upgrade_offer:
        subject: "Ready for unlimited invoicing? A special offer inside"
        eyebrow: A special offer
        heading: Ready for unlimited invoicing?
        lede: "You've been busy on SolidInvoice — nice work. Here's what unlocks on Pro, at a discount while it's still early."
        per: / month
        save: Save 36%
        locked_in: Locked in for 12 months when you upgrade this week.
        feature:
            1: "Unlimited invoices, quotes, and clients"
            2: "Recurring billing and automatic reminders"
            3: "Custom domains and white-label client portal"
            4: "Team seats and role-based permissions"
            5: "Priority email support (replies in under 4h)"
        compare_heading: "Free vs. Pro, side-by-side"
        compare:
            free: Free
            pro: Pro
            unlimited: Unlimited
            up_to_10: Up to 10
            row:
                invoices: Invoices per month
                clients: Clients
                recurring: Recurring invoices
                reminders: Automatic reminders
                portal: White-label portal
                team: Team members
        cta: "Upgrade to Pro — $12/mo"
        fine_print: "Cancel anytime. 30-day money-back guarantee. No surprise fees."
        ps: "invoicing more than five clients a month? The free plan will cap you. Upgrade before that happens to keep sending without interruption."
    trial_about_to_end:
        subject: Your trial is about to end
        eyebrow: Heads up · Account notice
        heading: "Your trial ends in %days% days."
        lede: "You've been busy. Here's a quick recap of what you've built on SolidInvoice so far — and what happens when the trial closes."
        days_label: Days remaining
        trial_ends: "Trial ends <b style=\"color: #475569;\">%date%</b>"
        usage_heading: Your workspace so far
        usage:
            clients: Clients added
            invoices: Invoices sent
            collected: Collected
        body_intro: "If you upgrade before your trial ends, everything stays exactly as it is — no data is lost, no invoices are archived, no clients are hidden. Just uninterrupted invoicing."
        if_not_heading: "What happens if you don't upgrade"
        if_not:
            1: "Your workspace moves to the <b>Free plan</b> — 5 invoices, 10 clients per month."
            2: "Existing invoices stay accessible and clients can still pay them."
            3: "Recurring invoices and automatic reminders pause."
            4: "You can upgrade any time to reactivate everything."
        cta:
            upgrade: Upgrade and keep going
            free: Stay on Free
        fine_print: "Questions about pricing, billing, or what to expect? Just reply — we read every email."
        ps: "use code STAYSOLID at checkout for 20% off your first three months. Offer expires with your trial."
