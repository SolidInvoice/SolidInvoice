name: Automatic Releases

on:
  milestone:
    types:
      - closed

permissions:
  contents: read

jobs:
  release:
    name: "GIT tag, release & create merge-up PR"
    runs-on: blacksmith-4vcpu-ubuntu-2404
    permissions:
      contents: write
      pull-requests: write
      issues: write
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: audit
          allowed-endpoints: >
            api.github.com:443
            archive.ubuntu.com:80
            auth.docker.io:443
            bun.sh:443
            github.com:443
            objects.githubusercontent.com:443
            packagist.org:443
            ppa.launchpadcontent.net:443
            production.cloudflare.docker.com:443
            registry-1.docker.io:443
            registry.yarnpkg.com:443
            repo.packagist.org:443
            raw.githubusercontent.com:443
            security.ubuntu.com:80
            uploads.github.com:443

      - name: Derive target branch from milestone title
        id: vars
        run: |
          version="${{ github.event.milestone.title }}"
          [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Milestone title must be semver"; exit 1; }
          IFS='.' read -r MAJOR MINOR PATCH <<<"$version"
          echo "branch=${MAJOR}.${MINOR}.x" >>"$GITHUB_OUTPUT"   # e.g. 2.3.x
          echo "tag=v${version}" >>"$GITHUB_OUTPUT"

      - name: Checkout
        uses: "actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0"
        with:
          ref: ${{ steps.vars.outputs.branch }}
          fetch-depth: 1

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: 8.5
          extensions: intl, gd, mysql, pdo_mysql, soap, zip, :xdebug
          coverage: none

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - name: Install jq
        run: sudo apt-get install jq

      - name: Bump version
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: 1
        run: "./scripts/bump_version.sh ${{ steps.vars.outputs.branch }} ${{ github.event.milestone.title }}"

      - name: Release
        run: "./scripts/create_release.sh ${{ github.event.milestone.title }} ${{ github.repository }}"
        env:
          GH_TOKEN: ${{ secrets.GH_ACCESS_TOKEN }}
          RELEASE: 1
