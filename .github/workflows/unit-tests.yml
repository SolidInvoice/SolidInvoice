name: Unit Tests

on:
    pull_request:
        paths-ignore:
            - 'docs/**'
    push:
        branches:
            - 3.0.x
            - 3.1.x
        paths-ignore:
            - 'docs/**'

permissions:
    contents: read
    issues: write
    pull-requests: write

jobs:
  unit:
    name: Unit ( PHP ${{ matrix.php }} )

    runs-on: ubuntu-latest

    strategy:
      matrix:
        php: [ '8.4' ]
        coverage: [ false ]
        include:
          - php: '8.5'
            coverage: true
      fail-fast: false

    env:
      SOLIDINVOICE_ENV: test
      SOLIDINVOICE_DEBUG: 0
      PANTHER_NO_HEADLESS: 0
      PANTHER_APP_ENV: test
      PANTHER_NO_SANDBOX: 1
      PANTHER_CHROME_ARGUMENTS: --disable-dev-shm-usage
      COVERAGE: 0

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@bf7454d06d71f1098171f2acdf0cd4708d7b5920 # v2.20.0
        with:
          egress-policy: block
          allowed-endpoints: >
            accounts.google.com:443
            android.clients.google.com:443
            api.cloudinary.com:443
            api.codecov.io:443
            api.github.com:443
            api.ipify.org:443
            api.iconify.design:443
            bun.sh:443
            cdn.jsdelivr.net:443
            chromedriver.storage.googleapis.com:443
            cli.codecov.io:443
            clients2.google.com:443
            clients2.google.com:80
            codecov.io:443
            content-autofill.googleapis.com:443
            content-autofill.googleapis.com:80
            coveralls.io:443
            dl.cloudsmith.io:443
            dl.google.com:443
            edgedl.me.gvt1.com:443
            github.com:443
            getcomposer.org:443
            googlechromelabs.github.io:443
            hosted-compute-watchdog-prod-iad-01.githubapp.com:443
            ingest.codecov.io:443
            keybase.io:443
            o26192.ingest.us.sentry.io:443
            objects.githubusercontent.com:443
            optimizationguide-pa.googleapis.com:443
            optimizationguide-pa.googleapis.com:80
            packagist.org:443
            passwordsleakcheck-pa.googleapis.com:443
            redirector.gvt1.com:443
            registry.npmjs.org:443
            registry.yarnpkg.com:443
            release-assets.githubusercontent.com:443
            repo.packagist.org:443
            setup-php.com:443
            storage.googleapis.com:443
            update.googleapis.com:80
            uploader.codecov.io:443
            www.google.com:443

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - uses: haya14busa/action-cond@94f77f7a80cd666cb3155084e428254fea4281fd
        id: coverage_driver
        with:
          cond: ${{ matrix.coverage }}
          if_true: pcov
          if_false: none

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version: ${{ matrix.php }}
          # opcache.jit is disabled because setup-php enables it by default and
          # PHP 8.4's JIT segfaults on its stack-limit check when the panther
          # web server (php -S) renders deeply nested pages like /install.
          # PHP 8.5 is not affected. See PR #2540.
          ini-values: date.timezone=Africa/Johannesburg, memory_limit=-1, opcache.jit=disable, opcache.jit_buffer_size=0
          extensions: intl, gd, mysql, pdo_mysql, soap, zip, :xdebug
          coverage: ${{ steps.coverage_driver.outputs.value }}

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v3

      - name: Detect browser drivers
        run: bin/bdi detect drivers

      - run: bun install

      - run: bun run build

      - name: Enable code coverage
        if: matrix.coverage
        run: echo "COVERAGE=1" >> $GITHUB_ENV

      - name: Run test suite
        run: |
          mkdir -p build/logs var/log && chmod 777 var/log
          if [ "$COVERAGE" = '1' ]; then
            bin/paratest --coverage-clover build/logs/clover.xml
          else
            bin/paratest
          fi

      - name: Upload coverage results to Codecov
        uses: codecov/codecov-action@5a1091511ad55cbe89839c7260b706298ca349f7
        if: matrix.coverage
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          files: build/logs/clover.xml
          flags: unittests
          fail_ci_if_error: false
          verbose: true

      - name: Add comment to PR with failure screenshots
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3
        if: ${{ failure() }}
        env:
            CLOUDINARY_URL: cloudinary://${{ secrets.CLOUDINARY_API_KEY }}:${{ secrets.CLOUDINARY_API_SECRET }}@${{ secrets.CLOUDINARY_CLOUD_NAME }}
            JOB_NAME: Unit ( PHP ${{ matrix.php }} )
        with:
          script: |
            const script = require('./scripts/e2e-failure.js')
            await script({github, context, core})
