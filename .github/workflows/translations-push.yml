name: Translations Push

concurrency:
  group: translations-push
  cancel-in-progress: false

on:
  push:
    branches:
      - 3.1.x
  workflow_dispatch:

permissions:
  contents: read

jobs:
  push:
    name: Push translations to Crowdin
    runs-on: ubuntu-latest
    if: github.repository == 'SolidInvoice/SolidInvoice'

    env:
      SOLIDINVOICE_ENV: dev
      SOLIDINVOICE_DEBUG: 1
      SOLIDINVOICE_TRANSLATION_DSN: ${{ secrets.CROWDIN_DSN }}

    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@95d9a5deda9de15063e7595e9719c11c38c90ae2
        with:
          egress-policy: audit

      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0

      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240
        with:
          php-version-file: .php-version
          ini-values: date.timezone=Africa/Johannesburg, memory_limit=-1
          extensions: intl, gd, mysql, pdo_mysql, :xdebug
          coverage: none

      - uses: ramsey/composer-install@65e4f84970763564f46a70b8a54b90d033b3bdda # v3

      - name: Push translations to Crowdin
        run: bin/console translation:push crowdin --force -v
