name: "Build OIDC image"

concurrency:
  cancel-in-progress: true
  group: ${{ github.workflow }}-${{ github.ref }}

on:
  push:
    branches:
      - feature/generic-oidc
  workflow_dispatch:

permissions:
  contents: read

env:
  IMAGE: ghcr.io/imagit-eu/solidinvoice
  VERSION: oidc-${{ github.sha }}
  PHP_VERSION: "8.5"

jobs:
  build-dist:
    name: Build distribution archive
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          ini-values: memory_limit=-1
          php-version-file: .php-version

      - name: Install bun
        uses: oven-sh/setup-bun@v2

      - name: Build distribution archive
        run: ./scripts/build_dist.sh "${GITHUB_REF_NAME}" "${VERSION}" --local
        env:
          RELEASE: 0

      - name: Upload distribution archive
        uses: actions/upload-artifact@v4
        with:
          name: solidinvoice-dist
          path: build/dist/SolidInvoice-*.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-image:
    name: Build and push image
    needs: [build-dist]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: frankenphp/go.mod
          cache-dependency-path: frankenphp/go.sum

      - name: Install PHP
        uses: shivammathur/setup-php@v2
        with:
          coverage: none
          ini-values: memory_limit=-1
          php-version: ${{ env.PHP_VERSION }}

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y autoconf automake bison cmake flex libtool pkg-config re2c upx

      - name: Diagnose Go toolchain
        run: |
          echo "which go: $(which go || echo none)"
          go version || true
          go env GOROOT GOTOOLCHAIN GOPATH GOFLAGS GOMODCACHE || true

      - name: Restore static-php cache
        id: static-php-cache
        uses: actions/cache/restore@v4
        with:
          path: frankenphp/dist/static-php-cli
          key: linux-amd64-static-php-${{ env.PHP_VERSION }}-${{ hashFiles('frankenphp/build-static.sh', 'frankenphp/build-solidinvoice.sh') }}
          restore-keys: |
            linux-amd64-static-php-${{ env.PHP_VERSION }}-
            linux-amd64-static-php-

      - name: Download distribution archive
        uses: actions/download-artifact@v4
        with:
          name: solidinvoice-dist
          path: build/dist

      - name: Build SolidInvoice binary
        run: ./scripts/build_binary.sh "${VERSION}" --skip-dist
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE: 0
          CI: ""
          SPC_OPT_DOWNLOAD_ARGS: "--ignore-cache-sources=php-src --retry 5 --prefer-pre-built"

      - name: Show build logs on failure
        if: failure()
        run: |
          set +e
          shopt -s nullglob
          for f in frankenphp/dist/static-php-cli/log/*.log; do
            echo "::group::=== ${f} ==="
            tail -n 300 "${f}"
            echo "::endgroup::"
          done

      - name: Upload build logs on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: frankenphp/dist/static-php-cli/log/
          if-no-files-found: warn

      - name: Save static-php cache
        if: always() && steps.static-php-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: frankenphp/dist/static-php-cli
          key: linux-amd64-static-php-${{ env.PHP_VERSION }}-${{ hashFiles('frankenphp/build-static.sh', 'frankenphp/build-solidinvoice.sh') }}

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Copy binary into Docker context
        run: cp frankenphp/dist/solidinvoice-linux-amd64 docker/solidinvoice

      - name: Build and push image
        uses: docker/bake-action@v6
        with:
          targets: package
          source: .
          push: true
          set: |
            package.platform=linux/amd64
            package.tags=${{ env.IMAGE }}:oidc-${{ github.sha }},${{ env.IMAGE }}:oidc
        env:
          SOLIDINVOICE_VERSION: ${{ env.VERSION }}
