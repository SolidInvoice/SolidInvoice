name: Zapier Integration

on:
  pull_request:
    paths:
      - 'integration/zapier/**'
      - '.github/workflows/zapier.yml'
  push:
    branches:
      - 3.0.x
    paths:
      - 'integration/zapier/**'
      - '.github/workflows/zapier.yml'
  workflow_dispatch:
    inputs:
      action:
        description: 'Action to take'
        type: choice
        required: true
        default: test
        options:
          - test
          - push
          - promote
      version:
        description: 'Version to promote (required for promote)'
        required: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate & Test
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: integration/zapier
    steps:
      - name: Harden Runner
        uses: step-security/harden-runner@v2
        with:
          egress-policy: audit

      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@735343b667d3e6f658f44d0eca948eb6282f2b76 # v2

      - name: Install dependencies
        run: bun install

      - name: Validate integration schema
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
        run: bunx zapier-platform-cli validate

      - name: Run tests
        run: bun run test

      - name: Push to Zapier
        if: >-
          github.event_name == 'push' ||
          (github.event_name == 'workflow_dispatch' && inputs.action != 'test')
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
        run: bunx zapier-platform-cli push

      - name: Promote version
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'promote'
        env:
          ZAPIER_DEPLOY_KEY: ${{ secrets.ZAPIER_DEPLOY_KEY }}
          PROMOTE_VERSION: ${{ inputs.version }}
        run: |
          if [ -z "$PROMOTE_VERSION" ]; then
            echo "::error::version input is required for promote"
            exit 1
          fi
          bunx zapier-platform-cli promote "$PROMOTE_VERSION"
