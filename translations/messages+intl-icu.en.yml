            after: '{frequency} from {start} to {end} ({count, plural, one {# occurrence} other {# occurrences}})'
            never: '{frequency} from {start}'
            'on': '{frequency} from {start} to {end}'
        view_all: '{count, plural, one {View # invoice} other {View all # invoices}}'
    reminder_email:
        overdue_14: '{days, plural, one {Invoice {invoice} remains unpaid after # day.} other {Invoice {invoice} remains unpaid after # days.}} This is our final automated reminder. Immediate payment is required to avoid service interruption. Please contact us if you need to discuss payment arrangements.'
        overdue_7: '{days, plural, one {Invoice {invoice} is now # day overdue.} other {Invoice {invoice} is now # days overdue.}} Please arrange payment at your earliest convenience. If there are any issues preventing payment, please contact us so we can help resolve them.'
        pre_due: '{days, plural, one {This is a friendly reminder that invoice {invoice} is due in # day.} other {This is a friendly reminder that invoice {invoice} is due in # days.}} We wanted to give you advance notice to make payment arrangements convenient.'
        stopped_days_overdue: '{days, plural, one {The final automated payment reminder has been sent for invoice {invoice}, which is now # day overdue.} other {The final automated payment reminder has been sent for invoice {invoice}, which is now # days overdue.}} All scheduled reminders are complete. Manual follow-up is recommended to resolve this outstanding payment.'
