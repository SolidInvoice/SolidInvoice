        subject: 'Your first invoice takes 2 minutes'
    signature:
        greeting: 'See you inside,'
        team: '— The SolidInvoice team'
    trial_about_to_end:
        charged:
            body: 'Your workspace carries on without a break. To change plan or cancel, do it before %date% and nothing is charged.'
            cta: 'Review your plan'
            eyebrow: 'Heads up · Upcoming charge'
            heading: 'Your card will be charged on %date%.'
            lede: 'Your %plan% trial ends tomorrow, and the card you added is charged on %date%.|Your %plan% trial ends in %days% days, and the card you added is charged on %date%.'
            subject: 'Your card will be charged on %date%'
        cta:
            upgrade: 'Stay on %plan%'
        days_label: 'Days remaining'
        eyebrow: 'Heads up · Trial ending'
        fine_print: 'Questions about billing or what to expect? Reply to this email — we read every one.'
        heading: 'Your trial ends tomorrow.|Your trial ends in %days% days.'
        keep:
            1: 'Your clients, invoices and payment history, exactly as they are'
            2: 'Unlimited invoices for up to 3 active clients'
            3: 'Online payments, so your clients can still pay by card'
        keep_heading: 'What you keep on Free'
        lede: 'On %date% your account moves to the Free plan. Nothing is deleted, and you can keep invoicing.'
        paid:
            1: 'More than 3 active clients'
            2: 'Recurring invoices on any schedule'
            3: 'Automatic reminders for overdue invoices'
            4: 'Team members on one account'
            5: 'Your own branding, without the SolidInvoice footer'
        paid_heading: 'What %plan% adds'
        subject: "Your trial ends tomorrow. Here's what you keep|Your trial ends in %days% days. Here's what you keep"
        trial_ends: 'Trial ends <b style="color: #475569;">%date%</b>'
        usage:
            clients: 'Clients added'
            collected: 'Invoices paid'
            invoices: 'Invoices sent'
        usage_heading: 'Your workspace so far'
    turn_invoices_into_payments:
        callout:
            sub: 'When paying is easy, clients pay. Make it easy.'
            title: 'Invoices with an online payment option get paid significantly faster than bank-transfer-only invoices'
        cta: 'Connect a payment method'
        eyebrow: 'Invoice sent'
        heading: 'Your first invoice is out. Now let them pay by card.'
        how:
            1: 'Go to Settings → Payment methods and connect Stripe or PayPal (30 seconds).'
            2: "Every invoice you send automatically includes a 'Pay now' button."
            3: 'Your client pays. You''re notified immediately. Invoice status flips to <b style="color: #2e963a;">Paid</b>.'
        how_heading: 'How it works'
        lede: "Connect Stripe or PayPal once and every invoice you send gets a 'Pay now' button. Your client pays from any device in seconds — you're notified the moment it goes through."
        method:
            bank: Bank
            cards: Cards
            eu_bank: 'EU bank'
            wallet: Wallet
        ps: 'SolidInvoice adds zero fees on top of your payment provider. You pay only what Stripe or PayPal charge.'
        subject: 'Invoice sent. Now let them pay by card'
    upgrade_offer:
        cta: 'Claim my %percent%% off'
        eyebrow: 'A gift for you'
        fine_print: 'Cancel anytime. No surprise fees.'
        heading: "Here's %percent%% off %plan%, before your trial ends."
        lede: "Your trial ends on %date%, and your account then moves to the Free plan. If you'd like to keep everything, here's a code that makes it cheaper."
        per: '/ month'
        ps: "if Free is enough for you, there's nothing to do. Your clients and invoices stay where they are."
        subject: 'A gift before your trial ends: %percent%% off %plan%'
    verify:
        body: 'We sent a confirmation link to %email%. Until you click it, invoices can be drafted but not sent.'
        cta: 'Confirm my email'
        eyebrow: 'One step left'
        title: 'Confirm your email to start sending invoices'
        why: 'We ask every new account to confirm its address before invoices go out to clients. It keeps SolidInvoice from being used to send fake invoices, and it takes one click.'
        wrong_address: 'Wrong address? Change it under your profile, then use the resend link on the banner inside SolidInvoice.'
    verify_email_final_reminder:
        heading: 'Your invoices are waiting on one click.'
        lede: "It's been a few days and %email% still isn't confirmed, so nothing you create can be sent to a client yet."
        subject: "Your invoices can't go out until you confirm your email"
    verify_email_reminder:
        heading: 'Confirm your email to send your first invoice.'
        lede: 'Your account is ready. The last step before your first invoice can reach a client is confirming %email%.'
        subject: 'Confirm your email to send invoices'
    welcome:
        closing: 'Your first invoice is the best place to start. It takes a few minutes.'
        cta: 'Create your first invoice'
        eyebrow: 'Your account is ready'
        feature:
            dashboard:
                desc: 'Your dashboard shows what is outstanding, what is overdue and what has been paid.'
                title: 'See who owes you'
            invoices:
                desc: 'Add your client as you go. Line items, tax and a due date are all built in.'
                title: 'Send your first invoice'
            payments:
                desc: 'Connect Stripe or PayPal and your clients can pay by card straight from the invoice.'
                title: 'Get paid online'
            quotes:
                desc: 'Send a quote first. When your client accepts it, it becomes an invoice.'
                title: 'Quote before you bill'
        heading: 'Good to have you, %name%.'
        intro: "Here's where most people start:"
        lede: 'Your account is set up and ready to use.'
        ps: 'questions? Just reply to this email. A real person answers.'
        subject: 'Your SolidInvoice account is ready'
