            credentials:
                subtitle: "Connect your account. You'll find these keys in your provider's dashboard."
                title: Credentials
            details:
                subtitle: 'How this payment method is identified inside SolidInvoice.'
                title: Details
            more:
                subtitle: 'Additional and legacy processors. Only use these if you already have an account with them.'
                title: 'More gateways'
            offline:
                subtitle: 'Record payments you receive outside SolidInvoice, such as cash or a bank transfer.'
                title: 'Offline & manual methods'
            online:
                subtitle: 'Charge cards automatically - your client pays through a secure checkout.'
                title: 'Online payment gateways'
        setup:
            default_label: 'How to get your API keys'
        stripe:
            comparison: "Stripe Checkout (recommended): Stripe hosts the payment page - it's the simplest to set up and the most secure, with no extra compliance work for you. Stripe.js: the card fields are embedded directly in SolidInvoice for a more seamless look, but you take on more PCI-compliance responsibility. If you're unsure, choose Stripe Checkout."
