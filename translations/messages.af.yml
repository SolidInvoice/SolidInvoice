        stripe_checkout:
            display_name: 'Stripe Checkout'
            overview: "Stripe redirects your client to a secure payment page hosted by Stripe, then brings them back once they've paid. It's the quickest and safest way to accept cards, because Stripe handles all the sensitive card data for you."
